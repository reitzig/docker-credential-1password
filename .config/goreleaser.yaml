# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./...
    env:
      - CGO_ENABLED=1 # cf. https://github.com/1Password/onepassword-sdk-go?tab=readme-ov-file#cross-compilation
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC="aarch64-linux-gnu-gcc"
          - CXX="aarch64-linux-gnu-g++"
    ldflags:
    - -s
    - -w
    - -X 'github.com/{{.ProjectName}}/internal/app.Version={{.Version}}'
    - -X 'github.com/{{.ProjectName}}/internal/app.Commit={{.Commit}}'
    - -X 'github.com/{{.ProjectName}}/internal/app.Date={{.Date}}'
    - -X 'github.com/{{.ProjectName}}/internal/app.BuiltBy=goreleaser'

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
changelog: # -> changie
  disable: false

release:
  draft: true
  replace_existing_draft: true
  footer: >-

    ---

    Released with [changie](https://github.com/miniscruff/changie) and [GoReleaser](https://github.com/goreleaser/goreleaser).
