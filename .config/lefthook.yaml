rc: lefthook.rc

post-checkout:
  piped: true
  commands:
    update-tools:
      priority: 1
      glob: "mise.*"
      run: mise install
    update-deps:
      priority: 2
      glob: "go.*"
      run: go mod tidy

pre-commit:
  piped: true
  commands:
    formatter:
      priority: 1
      glob: "*.go"
      run: go fmt .
      stage_fixed: true
    linter:
      priority: 2
      glob: "*.go"
      # NB: go linter takes only files from a single directory
      #     s.a. https://github.com/evilmartians/lefthook/discussions/631
      run: golangci-lint run .
    editorconfig:
      priority: 2
      run: ec --config .config/editorconfig-checker.json {staged_files}

commit-msg:
  skip:
    - ref: "wip/*"
  commands:
    cog:
      run: cog --config .config/cog.toml verify --ignore-fixup-commits --file {1}
