rc: lefthook.rc

post-checkout:
  piped: true
  commands:
    update-tools:
      priority: 1
      glob: "mise.*"
      run: mise install
    update-deps:
      priority: 2
      glob: "go.*"
      run: go mod tidy
pre-commit:
  piped: true
  commands:
    formatter:
      priority: 1
      glob: "*.go"
      run: go fmt .
      stage_fixed: true
    linter:
      priority: 2
      glob: "*.go"
      run: golangci-lint run .
    editorconfig:
      priority: 2
      run: ec --config .config/editorconfig-checker.json
commit-msg:
  skip:
    - ref: "wip/*"
  commands:
    cog:
      run: cog --config .config/cog.toml verify --ignore-fixup-commits --file {1}
